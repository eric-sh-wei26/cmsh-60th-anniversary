<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="基督教協同中學 60週年紀念徽章">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6CA95"/>
      <stop offset="50%" stop-color="#C59B5F"/>
      <stop offset="100%" stop-color="#9A723A"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#193152"/>
      <stop offset="100%" stop-color="#0E1C30"/>
    </linearGradient>
  </defs>

  <!-- Outer subtle rings -->
  <circle cx="90" cy="90" r="85" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="90" cy="90" r="78" fill="none" stroke="url(#goldGrad)" stroke-width="0.9" stroke-dasharray="3 3" opacity="0.8"/>

  <!-- Heritage shield outline -->
  <path d="M90 22 L134 38 V84 C134 118 114 140 90 154 C66 140 46 118 46 84 V38 Z"
        fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.85"/>

  <!-- Subtle cross at top of shield -->
  <g stroke="url(#goldGrad)" stroke-linecap="round">
    <line x1="90" y1="30" x2="90" y2="54" stroke-width="2.6"/>
    <line x1="80" y1="39" x2="100" y2="39" stroke-width="2.6"/>
  </g>

  <!-- Commemorative numeral 60 -->
  <text x="90" y="106" text-anchor="middle"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="56" font-weight="700" letter-spacing="-1"
        fill="url(#goldGrad)">60</text>

  <!-- Years 1967 - 2027 -->
  <text x="90" y="128" text-anchor="middle"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="12.5" font-weight="600" letter-spacing="2.2"
        fill="#E6CA95">1967 · 2027</text>

  <!-- Bottom motto -->
  <text x="90" y="166" text-anchor="middle"
        font-family="'Noto Serif TC', serif"
        font-size="10.5" font-weight="600" letter-spacing="3.5"
        fill="#DFBE87">協力同心</text>

  <!-- Left & right ornamental diamond accents -->
  <polygon points="24,90 28,86 32,90 28,94" fill="url(#goldGrad)"/>
  <polygon points="148,90 152,86 156,90 152,94" fill="url(#goldGrad)"/>
</svg>
